apiVersion: apps/v1
kind: Deployment
metadata:
  name: 15-luis-valle-deployment
  namespace: 15-luis-valle-namespace
  labels:
    app: 15-luis-valle-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: 15-luis-valle-app
  template:
    metadata:
      labels:
        app: 15-luis-valle-app
    spec:
      containers:
      - name: 15-luis-valle-container
        image: luisvalle1/15-luis-valle:1.0
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_R2DBC_URL
          value: "r2dbc:postgresql://ep-withered-cell-afl7k9xj-pooler.c-2.us-west-2.aws.neon.tech:5432/neondb?options=endpoint=ep-withered-cell-afl7k9xj"
        - name: SPRING_R2DBC_USERNAME
          valueFrom:
            secretKeyRef:
              name: 15-luis-valle-db-secret
              key: db-username
        - name: SPRING_R2DBC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: 15-luis-valle-db-secret
              key: db-password
        - name: RAPIDAPI_KEY
          value: "ab05570ba7msh5721c89ebac0f08p1cdd10jsn93d7f9f72c33"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /swagger-ui.html
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /swagger-ui.html
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30